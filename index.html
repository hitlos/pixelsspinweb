<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PixelsSpin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      background-color: #001133;
      color: yellow;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 32px;
      margin-top: 40px;
      text-shadow: 2px 2px 0 #000;
    }
	
	#age-gate {
	  position: fixed;
	  top: 0; left: 0;
	  width: 100%; height: 100%;
	  background-color: rgba(0, 0, 0, 0.95);
	  color: yellow;
	  font-family: 'Press Start 2P', monospace;
	  display: flex;
	  flex-direction: column;
	  justify-content: center;
	  align-items: center;
	  z-index: 9999;
	}

	#age-gate h2 {
	  font-size: 14px;
	  text-align: center;
	  margin: 0 20px;
	}

	#age-gate button {
	  margin: 20px;
	  padding: 12px 24px;
	  background-color: green;
	  color: #fff;
	  font-size: 14px;
	  border: 3px solid yellow;
	  cursor: pointer;
	  font-family: inherit;
	}

    #slot {
      margin: 40px auto;
      width: 320px;
      height: 320px;
      background: url('slot-machine.png') center center no-repeat;
      background-size: contain;
      position: relative;
      border: 8px solid gold;
    }

	.download-button {
	  position: absolute;
	  top: 50%;  /* Adjusted down from 44% */
	  left: 50%;
	  transform: translate(-50%, -50%);
	  padding: 12px 24px;
	  background-color: green;
	  color: #fff;
	  text-decoration: none;
	  font-size: 14px;
	  border: 3px solid yellow;
	  box-shadow: 0 0 12px yellow;
	  cursor: pointer;
	}

    .treasure {
      width: 96px;
      margin: 24px;
    }

    footer {
      margin-top: 50px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
	<div id="age-gate">
	  <h2>Are you 18 or older?</h2>
	  <button onclick="allowAccess()">Yes, I'm 13+</button>
	  <button onclick="denyAccess()">No</button>
	</div>

  <h1>Welcome to PixelsSpin!</h1>

  <div>
    <img class="treasure" src="gold-left.png" alt="Gold" />
    <img class="treasure" src="gold-right.png" alt="Gold" />
  </div>

  <div id="slot">
	<a class="download-button" href="pixelsspin.apk" target="_blank" rel="noopener">
	  Download APK
	</a>
  </div>

  <footer>
    &copy; 2025 PixelsSpin. All rights reserved.
  </footer>
<script>
  function allowAccess() {
    document.getElementById('age-gate').style.display = 'none';
  }

  function denyAccess() {
    window.location.href = 'https://google.com'; // Or another safe location
  }
</script>
</body>
</html>
